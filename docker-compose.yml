name: ediary

networks:
  backend-network:

services:
  database:
    container_name: ediary_database
    image: postgres:16
    volumes:
      - ./data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "ediary_db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    networks:
      - backend-network
  ediary:
    container_name: ediary_backend
    image: ediary
    ports:
      - "8080:8080"
    build:
      context: .
      dockerfile: EDiary/Dockerfile
    networks:
      - backend-network